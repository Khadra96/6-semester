services:
  database:
    image: postgres:16-alpine
    container_name: voltedge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - voltedge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U voltedge_user -d voltedge
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  voltedge_postgres_data: